<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>images</title>
    <style>
        body {
            background-color: pink;
            background-image: url("black-white-flowers.png");
        }

        img {
            border: 5px solid rgb(205, 133, 145);
            border-radius: 50px;
            box-shadow: 15px 20px 10px hsl(340, 57%, 64%);
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 900px;
        }

        img:hover {
            transform: scale(1.2);
        }

        .hi {
            color: rgb(135, 60, 205);
        }

        .hii {
            color: rgb(84, 183, 183);
        }
        div {
            width: 300px; 
            height: 300px;
            background-image: url("swirls.jpg"); 
        }
    </style>
</head>


<body>
    <h1 class="hii">gary the fairy</h1>
    <img src="ahhhh.jpg" alt="fairy raccoon" />
    <p class="hi">this is gary he is a fairy raccoon</p>
    <div id="one"> <p> kale is a gay boy </p></div>
</body>

</html>
